{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CheckIn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0d10;
  --panel: #14181d;
  --line: #232a32;
  --text: #e8edf2;
  --muted: #8b97a5;
  --accent: #3b82f6;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 28px 20px 64px;
  background: var(--bg); color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 16px; line-height: 1.5;
}
.wrap { max-width: 460px; margin: 0 auto; }
h1 { font-size: 28px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.02em; }
h2 { font-size: 16px; font-weight: 600; margin: 32px 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
p.sub { color: var(--muted); margin: 0 0 28px; }
label { display: block; font-size: 14px; font-weight: 500; margin: 18px 0 6px; }
input[type=text], input[type=tel], input[type=url], select {
  width: 100%; padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--panel); color: var(--text);
  font-family: inherit; font-size: 16px;
}
input:focus, select:focus { outline: none; border-color: var(--accent); }
.radios { display: flex; gap: 10px; }
.radios label {
  flex: 1; margin: 0; padding: 12px; text-align: center;
  border: 1px solid var(--line); border-radius: 10px; background: var(--panel); cursor: pointer;
}
.radios input { margin-right: 6px; accent-color: var(--accent); }
button {
  width: 100%; margin-top: 26px; padding: 14px; border: 0; border-radius: 10px;
  background: var(--accent); color: #fff; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
}
button:hover { background: #2f6fd8; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.card .when { color: var(--muted); font-size: 13px; }
.card .mood { color: var(--accent); letter-spacing: 2px; }
.topics { color: var(--muted); font-size: 13px; margin-top: 6px; }
.err { background: #2a1417; border: 1px solid #5b2029; color: #ffb4b4; padding: 12px; border-radius: 10px; margin-bottom: 16px; }
a { color: var(--accent); }
.hint { color: var(--muted); font-size: 13px; margin-top: 8px; }

/* wizard */
.dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 36px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); transition: background .2s; }
.dot.on { background: var(--accent); }
.step { display: none; }
.step.on { display: block; animation: rise .22s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.step h1 { font-size: 32px; line-height: 1.2; margin-bottom: 10px; }
.step .sub { margin-bottom: 26px; }
input.big { font-size: 22px; padding: 16px; text-align: center; letter-spacing: 0.5px; }
button.choice {
  display: block; width: 100%; text-align: left; margin: 0 0 12px;
  padding: 18px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; color: var(--text); font-weight: 500;
}
button.choice:hover, button.choice:focus { background: #1a2029; border-color: var(--accent); }
button.choice strong { display: block; font-size: 18px; font-weight: 600; }
button.choice span { color: var(--muted); font-size: 14px; }
button.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); margin-top: 12px; }
button.ghost:hover { background: var(--panel); }
.btn-link {
  display: block; margin-top: 26px; padding: 14px; border-radius: 10px;
  background: var(--accent); color: #fff; text-align: center; font-weight: 600; text-decoration: none;
}
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
.panel label { margin-top: 0; }
.panel button { margin-top: 12px; }
.status { color: var(--muted); font-size: 13px; min-height: 18px; margin-top: 10px; }
</style>
</head>
<body><div class="wrap">{{end}}

{{define "foot"}}</div></body></html>{{end}}
