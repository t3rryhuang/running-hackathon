{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d10">
<title>CheckIn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0d10;
  --panel: #14181d;
  --panel-hi: #1a2029;
  --line: #232a32;
  --text: #e8edf2;
  --muted: #8b97a5;
  --accent: #3b82f6;
  --accent-hi: #60a5fa;
  --radius: 14px;
  --ring: 0 0 0 3px rgba(59, 130, 246, 0.25);
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 28px 20px 72px;
  background: var(--bg); color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
/* Ambient wash so the single-column flow doesn't read as a bare form. */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(60% 40% at 50% -8%, rgba(59, 130, 246, 0.18), transparent 70%),
    radial-gradient(40% 30% at 110% 20%, rgba(96, 165, 250, 0.08), transparent 70%);
}
.wrap { max-width: 460px; margin: 0 auto; }
.brand {
  display: flex; align-items: center; gap: 9px;
  font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
  color: var(--muted); margin-bottom: 30px;
}
.brand .mark {
  width: 22px; height: 22px; border-radius: 7px;
  background: linear-gradient(140deg, var(--accent-hi), var(--accent));
  box-shadow: 0 6px 18px rgba(59, 130, 246, 0.35);
}
h1 { font-size: 28px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.025em; }
h2 { font-size: 13px; font-weight: 600; margin: 34px 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
p.sub { color: var(--muted); margin: 0 0 28px; }
label { display: block; font-size: 14px; font-weight: 500; margin: 18px 0 6px; }
input[type=text], input[type=tel], input[type=url], select {
  width: 100%; padding: 13px 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--panel); color: var(--text);
  font-family: inherit; font-size: 16px;
  transition: border-color .15s, box-shadow .15s;
}
input::placeholder { color: #55606d; }
input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring); }
.radios { display: flex; gap: 10px; }
.radios label {
  flex: 1; margin: 0; padding: 12px; text-align: center;
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel); cursor: pointer;
}
.radios input { margin-right: 6px; accent-color: var(--accent); }
button {
  width: 100%; margin-top: 24px; padding: 15px; border: 0; border-radius: 12px;
  background: var(--accent); color: #fff; font-family: inherit; font-size: 16px; font-weight: 600;
  cursor: pointer; transition: background .15s, transform .08s, box-shadow .15s;
  box-shadow: 0 8px 22px rgba(59, 130, 246, 0.22);
}
button:hover { background: #2f6fd8; }
button:active { transform: translateY(1px); }
button:focus-visible { outline: none; box-shadow: var(--ring); }
button[disabled] { opacity: .6; cursor: default; box-shadow: none; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; margin-bottom: 12px;
}
.card .when { color: var(--muted); font-size: 13px; }
.card .mood { color: var(--accent); letter-spacing: 2px; }
.topics { color: var(--muted); font-size: 13px; margin-top: 6px; }
.err {
  background: #2a1417; border: 1px solid #5b2029; color: #ffb4b4;
  padding: 12px 14px; border-radius: 12px; margin-bottom: 16px; font-size: 14px;
}
a { color: var(--accent); }
.hint { color: var(--muted); font-size: 13px; margin-top: 10px; min-height: 18px; }

/* wizard */
.dots { display: flex; gap: 6px; margin-bottom: 38px; }
.dot { flex: 1; height: 3px; border-radius: 2px; background: var(--line); transition: background .25s ease; }
.dot.on { background: var(--accent); }
.step { display: none; }
.step.on { display: block; animation: rise .24s cubic-bezier(.2, .7, .3, 1); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.step h1 { font-size: 32px; line-height: 1.18; margin-bottom: 10px; }
.step .sub { margin-bottom: 26px; }
input.big { font-size: 22px; padding: 17px; text-align: center; letter-spacing: 0.4px; }
button.choice {
  display: block; width: 100%; text-align: left; margin: 0 0 12px; box-shadow: none;
  padding: 18px; background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); color: var(--text); font-weight: 500;
}
button.choice:hover, button.choice:focus-visible {
  background: var(--panel-hi); border-color: var(--accent); transform: translateY(-1px);
}
button.choice strong { display: block; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
button.choice span { color: var(--muted); font-size: 14px; }
button.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); margin-top: 12px; box-shadow: none; }
button.ghost:hover { background: var(--panel); color: var(--text); }
.btn-link {
  display: block; margin-top: 24px; padding: 15px; border-radius: 12px;
  background: var(--accent); color: #fff; text-align: center; font-weight: 600; text-decoration: none;
  box-shadow: 0 8px 22px rgba(59, 130, 246, 0.22);
}
.btn-link:hover { background: #2f6fd8; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; }
.panel label { margin-top: 0; }
.panel button { margin-top: 12px; }
.status { color: var(--muted); font-size: 13px; min-height: 18px; margin-top: 10px; }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body><div class="wrap">
<div class="brand"><span class="mark"></span>CheckIn</div>
{{end}}

{{define "foot"}}</div></body></html>{{end}}
